<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="targetGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="redRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#targetGlow)"/>
  <!-- Target Base Ring -->
  <circle cx="32" cy="32" r="26" fill="#1b1226" stroke="url(#targetGold)" stroke-width="2.5"/>
  <!-- Target Concentric Rings -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#redRing)" stroke-width="3"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="8" fill="url(#redRing)" stroke="url(#targetGold)" stroke-width="1.5"/>
  <!-- Crosshairs -->
  <line x1="32" y1="7" x2="32" y2="17" stroke="url(#targetGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="57" stroke="url(#targetGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="17" y2="32" stroke="url(#targetGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="57" y2="32" stroke="url(#targetGold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Target Arrow Stuck in Center -->
  <g transform="rotate(-30 32 32)">
    <line x1="32" y1="12" x2="32" y2="32" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arrow Fletching -->
    <polygon points="32,10 27,15 32,14" fill="#00e5ff"/>
    <polygon points="32,10 37,15 32,14" fill="#00e5ff"/>
    <circle cx="32" cy="32" r="3.5" fill="#fff"/>
  </g>
  <!-- Gold Stars at 4 corners -->
  <polygon points="12,12 14,9 16,12 19,13 16,15 17,18 14,16 11,18 12,15 9,13" fill="#ffd700"/>
  <polygon points="52,12 54,9 56,12 59,13 56,15 57,18 54,16 51,18 52,15 49,13" fill="#ffd700"/>
</svg>