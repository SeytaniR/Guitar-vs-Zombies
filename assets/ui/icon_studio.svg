<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="studGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="studGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="studGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Headphones Arch -->
  <path d="M12 36 C12 18, 20 8, 32 8 C44 8, 52 18, 52 36" fill="none" stroke="url(#studGrad1)" stroke-width="5" stroke-linecap="round" filter="url(#studGlow)" />
  <!-- Arch inner cushion band -->
  <path d="M18 24 C22 14, 28 12, 32 12 C36 12, 42 14, 46 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  
  <!-- Equalizer waves in center -->
  <g fill="url(#studGrad2)">
    <rect x="22" y="30" width="3" height="12" rx="1.5" />
    <rect x="27" y="24" width="3" height="18" rx="1.5" />
    <rect x="32" y="20" width="3" height="22" rx="1.5" fill="#f43f5e" />
    <rect x="37" y="25" width="3" height="17" rx="1.5" />
    <rect x="42" y="32" width="3" height="10" rx="1.5" />
  </g>
  
  <!-- Left Ear Cup -->
  <g filter="url(#studGlow)">
    <rect x="8" y="32" width="10" height="20" rx="5" fill="#1e1e2f" stroke="url(#studGrad1)" stroke-width="2" />
    <rect x="14" y="35" width="3" height="14" rx="1.5" fill="#a855f7" />
  </g>
  
  <!-- Right Ear Cup -->
  <g filter="url(#studGlow)">
    <rect x="46" y="32" width="10" height="20" rx="5" fill="#1e1e2f" stroke="url(#studGrad1)" stroke-width="2" />
    <rect x="47" y="35" width="3" height="14" rx="1.5" fill="#a855f7" />
  </g>
</svg>
